<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Raj Tripathi — Portfolio</title>
    <meta
      name="description"
      content="Raj Tripathi — business-technology and AI/data problem solver with real-world experience inside a large chemical manufacturing environment. Projects, experience, hackathon wins, skills and resume."
    />
    <link rel="canonical" href="%SITE_URL%/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#eef0f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1c1f" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Raj Tripathi — Portfolio" />
    <meta property="og:title" content="Raj Tripathi — Portfolio" />
    <meta
      property="og:description"
      content="B.Tech — Artificial Intelligence & Data Science | KJ Somaiya College of Engineering, Mumbai. Projects, experience, hackathon wins and resume."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Raj Tripathi — B.Tech, Artificial Intelligence & Data Science" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Raj Tripathi — Portfolio" />
    <meta
      name="twitter:description"
      content="Projects, experience, hackathon wins and resume — as a macOS-style desktop or a simple Quick View."
    />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />

    <script>
      // Apply the saved/system theme before first paint to avoid a light flash in dark mode.
      (function () {
        try {
          var t = localStorage.getItem("rt-portfolio:theme") || "system";
          var d = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          if (d) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 24px">
        This interactive portfolio needs JavaScript. Read the full portfolio as a simple page:
        <a href="/quick">Raj Tripathi — Quick View</a>.
      </p>
    </noscript>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
