<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Raj Tripathi — Portfolio</title>
    <meta
      name="description"
      content="Raj Tripathi — business-technology and AI/data problem solver. Experience, projects, hackathon wins, skills and resume."
    />
    <meta name="theme-color" content="#eef0f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1c1f" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the saved/system theme before first paint to avoid a light flash in dark mode.
      (function () {
        try {
          var t = localStorage.getItem("rt-portfolio:theme") || "system";
          var d = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          if (d) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
